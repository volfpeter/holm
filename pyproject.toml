[project]
name = "holm"
dynamic = ["version"]
description = "Web development framework that brings the Next.js developer experience to Python, built on FastAPI, htmy, and FastHX."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.0",
    "fasthx>=3.2.2",
    "htmy[jinja,lxml]>=0.13.1",
    "markupsafe>=3.0.3",
    "python-multipart>=0.0.20",
    "typer>=0.27.1",
]

[project.scripts]
holm = "holm.cli:app"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=2.0.3",
    "mypy>=2.1.0",
    "poethepoet>=0.44.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.0.3",
    "pytest-random-order>=1.2.0",
    "ruff>=0.15.10",
    "uvicorn>=0.44.0",
    "watchfiles>=1.1.1",
    "zensical>=0.0.51",
]

[tool.mypy]
strict = true
exclude = [
    "dev",
    "examples/actions-with-htmx",
    "examples/forms",
    "examples/jinja-layout",
    "examples/jinja-layout-default-slots",
    "examples/jinja-multi-slot-layout",
    "examples/jinja-quick-start",
    "examples/minimal",
    "examples/quick-start-guide",
    "examples/rendering-apis-with-htmx",
]
explicit_package_bases = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "holm.resources.app_template_slim.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["components", "components.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "holm.resources.app_template.app.showcase.page"
disable_error_code = ["no-any-return"]

[tool.pdm.build]
# TODO: find a way to exclude test_app/ from the wheel build.
# This config can be removed then, and tests/ and tests_app/ can be added back
# to the source build as expected, but excluded from the wheel build.
excludes = [
    "tests/",
    "test_app/",
    ".pdm-build/",
    "**/.ruff_cache/",
    "**/__pycache__/",
    "**/*.pyc",
    "**/.mypy_cache/",
]

[tool.pdm.version]
source = "file"
path = "holm/__init__.py"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--random-order"

[tool.ruff]
line-length = 108
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "dist",
    "docs",
]
lint.select = [
    "B", # flake8-bugbear
    "C", # flake8-comprehensions
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "S", # flake8-bandit - we must ignore these rules in tests
    "W", # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"] # S101: use of assert detected
"holm/resources/app_template_slim/app/main.py" = ["I001"] # overlay fragment; .head resolves only after overlaying onto the base template

[tool.poe.tasks]

test-app.cmd = "uvicorn test_app.main:app --reload"

format = "ruff format . --check"
format-fix = "ruff format ."

lint = "ruff check ."
lint-fix = "ruff check . --fix"

type = "mypy ."

check.sequence = ["format", "lint", "type"]
check.ignore_fail = "return_non_zero"

test = "python -m pytest tests"

serve-docs = "zensical serve"
